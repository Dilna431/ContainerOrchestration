version: '3'
services:
  mongo:
    image: mongo
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/app_db
    depends_on:
      - mongo

  frontend-blue:
    build: ./frontend-blue
    ports:
      - "3000:3000"
    depends_on:
      - backend

  frontend-green:
    build: ./frontend-green
    ports:
      - "3001:3000"
    depends_on:
      - backend
